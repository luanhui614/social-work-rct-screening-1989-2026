name: Verify frozen screening and human adjudication results
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify.py --snapshot
      - run: python scripts/reproduce.py
      - run: python scripts/export_review_worklist.py
      - run: python scripts/verify.py --generated
      - run: python scripts/check_release_status.py
